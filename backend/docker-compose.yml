services:
  db:
    image: postgis/postgis:15-3.4
    container_name: floodshield_db_container
    environment:
      POSTGRES_USER: floodshield_user
      POSTGRES_PASSWORD: floodshield_pass
      POSTGRES_DB: floodshield_db
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
